name: release

# Publishes to PyPI when a v* tag is pushed, through Trusted Publishing (OIDC):
# PyPI trusts this repository, this workflow file and the `pypi` environment,
# so no API token exists anywhere. See RELEASING.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install build tooling
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check build twine

      - name: Build sdist and wheel
        run: python -m build

      # The version is a static string in src/emmykit/_version.py, not derived
      # from the tag, so the two can disagree: tag v0.7.1 with _version.py still
      # at 0.7.0 builds emmykit-0.7.0. PyPI filenames are immutable, so
      # publishing the wrong one burns that version number. Fail here instead.
      # _version.py is run on its own rather than imported through the package,
      # which would compute COMPUTER_NAME and friends for no reason.
      - name: Assert the tag matches __version__
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="$(python -c 'import runpy; print(runpy.run_path("src/emmykit/_version.py")["__version__"])')"
          echo "tag=${tag}  __version__=${version}"
          if [ "${tag}" != "v${version}" ]; then
            echo "::error::tag ${tag} does not match emmykit.__version__ ${version} (expected v${version})"
            exit 1
          fi
          test -f "dist/emmykit-${version}.tar.gz"
          test -f "dist/emmykit-${version}-py3-none-any.whl"

      # emmykit is pure Python. A platform-tagged wheel would mean the build
      # went wrong, and most users could not install it.
      - name: Assert the wheel is pure Python
        run: |
          set -euo pipefail
          ls dist/
          test -n "$(ls dist/*-py3-none-any.whl)"

      # A bare install has no third-party dependencies, and every optional one
      # is imported inside the function that needs it, so the package must
      # import with none of them present.
      - name: Import the wheel without extras
        run: |
          set -euo pipefail
          python -m venv /tmp/bare
          /tmp/bare/bin/python -m pip install --disable-pip-version-check dist/*-py3-none-any.whl
          cd /tmp && /tmp/bare/bin/python -c 'import emmykit; print(emmykit.__version__, len(emmykit.__all__), "names")'

      - name: twine check
        run: python -m twine check --strict dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Required for PyPI Trusted Publishing (OIDC). No API token exists.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
